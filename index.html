<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayWhot Multiplayer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --felt-green: #0d5c2e;
      --felt-dark: #073a1d;
      --card-gold: #f59e0b;
      --card-bg: #fffbf0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; user-select: none; }
    body { background: radial-gradient(circle, var(--felt-green) 40%, var(--felt-dark) 100%); height: 100vh; display: flex; flex-direction: column; color: white; overflow: hidden; }

    .app-bar { height: 50px; background: rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; }
    .brand { font-size: 1.2rem; font-weight: 900; color: #fbbf24; }
    .status-badge { background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; }

    .lobby { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 200; }
    .lobby-box { background: #1e293b; padding: 2rem; border-radius: 16px; text-align: center; max-width: 350px; width: 90%; }
    .lobby-box input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; }
    .lobby-box button { width: 100%; padding: 10px; background: #f59e0b; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

    .table-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 1rem 2rem; }
    .player-profile { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.3); padding: 6px 14px; border-radius: 20px; width: fit-content; }

    .center-arena { display: flex; justify-content: center; align-items: center; gap: 2rem; margin: auto 0; }
    .card { width: 80px; height: 120px; background: var(--card-bg); border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px; color: #1e293b; position: relative; cursor: pointer; border: 2px solid #cbd5e1; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
    .card.back { background: linear-gradient(135deg, #1e3a8a, #3b82f6); border-color: #60a5fa; }
    .card.whot-special { background: linear-gradient(135deg, #fef08a, #facc15); border-color: #d97706; }
    .card-num { font-weight: 900; font-size: 1rem; }
    .card-symbol { font-size: 1.8rem; text-align: center; }

    .hand { display: flex; justify-content: center; min-height: 130px; }
    .player-hand-container .card { margin: 0 -12px; transition: transform 0.2s; }
    .player-hand-container .card:hover { transform: translateY(-10px); z-index: 10; }
    .computer-hand-container .card { margin: 0 -20px; pointer-events: none; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal-card { background: #1e293b; padding: 1.5rem; border-radius: 16px; text-align: center; }
    .shape-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 1rem; }
    .shape-btn { background: #334155; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
  </style>
</head>
<body>

  <div class="lobby" id="lobby">
    <div class="lobby-box">
      <h2 style="color: #fbbf24; margin-bottom: 1rem;">Join Whot Room</h2>
      <input type="text" id="player-name-input" placeholder="Your Name" value="Player 1">
      <input type="text" id="room-id-input" placeholder="Room Code (e.g., 1001)" value="1001">
      <button onclick="joinGame()">Join Room</button>
    </div>
  </div>

  <div class="app-bar">
    <div class="brand">PLAYWHOT ONLINE</div>
    <div class="status-badge" id="status-text">Connecting...</div>
  </div>

  <div class="table-container">
    <div class="player-profile">
      <div>🤖 <span id="opp-name">Opponent</span> (<span id="opp-count">0</span>)</div>
    </div>

    <div class="hand computer-hand-container" id="opp-hand"></div>

    <div class="center-arena">
      <div class="card back" id="draw-deck"></div>
      <div id="top-card-container"></div>
    </div>

    <div class="hand player-hand-container" id="my-hand"></div>

    <div class="player-profile" style="align-self: flex-end;">
      <div>👤 <span id="my-name">You</span></div>
    </div>
  </div>

  <div class="modal" id="shape-modal">
    <div class="modal-card">
      <h3 style="color: #fbbf24;">WHOT! Choose Shape</h3>
      <div class="shape-grid" id="shape-buttons"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const SHAPES = ["Circle", "Square", "Triangle", "Cross", "Star"];
    const SYMBOLS = { "Circle": "◯", "Square": "▢", "Triangle": "△", "Cross": "┼", "Star": "★", "Whot": "W" };

    let roomId = "";
    let myHand = [];
    let isMyTurn = false;
    let pendingCardIndex = null;

    function joinGame() {
      const name = document.getElementById('player-name-input').value.trim();
      roomId = document.getElementById('room-id-input').value.trim();

      if (!roomId) return alert("Enter Room Code");

      document.getElementById('my-name').innerText = name;
      socket.emit('joinRoom', { roomId, playerName: name });
      document.getElementById('lobby').style.display = 'none';
    }

    socket.on('waitingForOpponent', () => {
      document.getElementById('status-text').innerText = "Waiting for an opponent to join...";
    });

    socket.on('gameState', (data) => {
      myHand = data.myHand;
      isMyTurn = data.isMyTurn;

      document.getElementById('status-text').innerText = isMyTurn ? "Your Turn" : "Opponent's Turn";
      document.getElementById('opp-name').innerText = data.opponentName;
      document.getElementById('opp-count').innerText = data.opponentCardCount;

      render(data.topCard, data.opponentCardCount, data.currentDemand);
    });

    socket.on('gameOver', ({ winner }) => {
      alert(`Game Over! Winner: ${winner}`);
      location.reload();
    });

    socket.on('playerDisconnected', () => {
      alert("Opponent disconnected!");
      location.reload();
    });

    function render(topCard, oppCount, demand) {
      // Opponent hand
      const oppContainer = document.getElementById('opp-hand');
      oppContainer.innerHTML = '';
      for (let i = 0; i < oppCount; i++) {
        const c = document.createElement('div');
        c.className = 'card back';
        oppContainer.appendChild(c);
      }

      // My hand
      const myContainer = document.getElementById('my-hand');
      myContainer.innerHTML = '';
      myHand.forEach((card, idx) => {
        const el = createCardUI(card);
        el.onclick = () => playCard(idx);
        myContainer.appendChild(el);
      });

      // Top card
      const topContainer = document.getElementById('top-card-container');
      topContainer.innerHTML = '';
      if (topCard) {
        topContainer.appendChild(createCardUI(topCard));
      }
    }

    function createCardUI(card) {
      const el = document.createElement('div');
      el.className = 'card';
      if (card.shape === "Whot") el.classList.add('whot-special');

      const sym = SYMBOLS[card.shape];
      const val = card.shape === "Whot" ? "20" : card.number;

      el.innerHTML = `
        <div class="card-num">${val}</div>
        <div class="card-symbol">${sym}</div>
        <div class="card-num" style="text-align:right">${val}</div>
      `;
      return el;
    }

    document.getElementById('draw-deck').onclick = () => {
      if (!isMyTurn) return;
      socket.emit('drawCard', { roomId });
    };

    function playCard(index) {
      if (!isMyTurn) return;
      const card = myHand[index];

      if (card.shape === "Whot") {
        pendingCardIndex = index;
        openShapeModal();
      } else {
        socket.emit('playCard', { roomId, cardIndex: index });
      }
    }

    function openShapeModal() {
      const modal = document.getElementById('shape-modal');
      const grid = document.getElementById('shape-buttons');
      grid.innerHTML = '';

      SHAPES.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'shape-btn';
        btn.innerText = `${SYMBOLS[s]} ${s}`;
        btn.onclick = () => {
          modal.style.display = 'none';
          socket.emit('playCard', { roomId, cardIndex: pendingCardIndex, requestedShape: s });
        };
        grid.appendChild(btn);
      });

      modal.style.display = 'flex';
    }
  </script>
</body>
</html>
