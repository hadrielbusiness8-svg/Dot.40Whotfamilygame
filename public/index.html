<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot.40 Multiplayer Whot!</title>
    <!-- PeerJS for P2P Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .container { width: 100%; max-width: 950px; height: 92vh; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; }

        /* SCREENS */
        .screen { display: none; flex-direction: column; height: 100%; padding: 20px; }
        .screen.active { display: flex; }

        #lobby-screen { justify-content: center; align-items: center; text-align: center; gap: 20px; }
        h1 { color: #facc15; font-size: 38px; letter-spacing: 2px; }
        .card-box { background: #0f172a; padding: 25px; border-radius: 10px; border: 1px solid #334155; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        
        input, button { padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; }
        input { background: #1e293b; color: white; border: 1px solid #475569; text-align: center; }
        button { background: #3b82f6; color: white; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }

        /* WAITING ROOM */
        #waiting-room { justify-content: center; align-items: center; text-align: center; gap: 20px; }
        .player-list { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .player-chip { background: #334155; padding: 10px 20px; border-radius: 20px; font-weight: bold; border: 1px solid #475569; }

        /* GAME BOARD */
        #game-screen { padding: 0; }
        .room-bar { background: #0f172a; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; font-size: 14px; color: #94a3b8; }
        .table-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 40px; background: #134e4a; position: relative; }
        
        .card-pile { width: 90px; height: 130px; background: #334155; border-radius: 8px; border: 2px dashed #94a3b8; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; color: #cbd5e1; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-pile:hover { background: #475569; }

        .active-card-display { width: 100px; height: 145px; background: #ffffff; color: #0f172a; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; font-weight: bold; box-shadow: 0 8px 16px rgba(0,0,0,0.4); position: relative; }

        .player-section { background: #0f172a; padding: 15px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #334155; }
        .player-info { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
        .player-hand { display: flex; gap: 10px; overflow-x: auto; padding: 5px; min-height: 140px; align-items: center; }

        .card { min-width: 90px; height: 130px; background: #ffffff; color: #0f172a; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s, background-color 0.2s; user-select: none; flex-shrink: 0; }
        .card:hover { transform: translateY(-10px); background: #f1f5f9; }

        .card.circle { color: #dc2626; }
        .card.triangle { color: #16a34a; }
        .card.cross { color: #2563eb; }
        .card.square { color: #d97706; }
        .card.star { color: #7c3aed; }
        .card.whot { color: #db2777; }

        .card-top { font-size: 16px; }
        .card-center { font-size: 24px; text-align: center; align-self: center; }
        .card-bottom { font-size: 16px; text-align: right; transform: rotate(180deg); }

        /* WHOT MODAL */
        #whot-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; border: 2px solid #facc15; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .shape-btns { display: flex; gap: 10px; justify-content: center; }
        .shape-btn { padding: 10px 15px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
        <h1>DOT.40 MULTIPLAYER</h1>
        <div class="card-box">
            <input type="text" id="player-name" placeholder="Enter Your Name" maxlength="12">
            <button onclick="hostGame()">Host New Room</button>
            <div style="border-top: 1px solid #334155; margin: 5px 0;"></div>
            <input type="text" id="room-code-input" placeholder="Enter Room Code">
            <button style="background: #10b981;" onclick="joinGame()">Join Room</button>
        </div>
    </div>

    <!-- WAITING ROOM -->
    <div id="waiting-room" class="screen">
        <h2>ROOM LOBBY</h2>
        <p>Share this Room Code with your friends (2 to 4 players max):</p>
        <h1 id="display-room-code" style="color: #38bdf8; font-family: monospace;">---</h1>
        <div class="player-list" id="waiting-players-list">
            <!-- Connected players shown here -->
        </div>
        <p id="host-waiting-msg" style="color: #94a3b8; font-size: 14px;"></p>
        <button id="start-match-btn" style="background: #10b981; display: none;" onclick="hostStartGame()">Start Game Now</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
        <div class="room-bar">
            <span id="room-info-display">Room: ---</span>
            <span id="turn-indicator" style="color: #facc15; font-weight: bold;">Waiting for turn...</span>
        </div>
        <div class="table-center">
            <div class="card-pile" onclick="drawCard()">
                DECK<br><span id="deck-count" style="font-size: 11px; color: #94a3b8;">0 left</span>
            </div>
            <div id="active-card-container"></div>
        </div>
        <div class="player-section">
            <div class="player-info">
                <span id="my-name-label">YOUR HAND</span>
                <span id="game-status-msg" style="color: #38bdf8;">Match in progress</span>
            </div>
            <div class="player-hand" id="player-hand"></div>
        </div>
    </div>
</div>

<!-- WHOT SHAPE PICKER MODAL -->
<div id="whot-modal">
    <div class="modal-content">
        <h3>Choose a Shape</h3>
        <div class="shape-btns">
            <button class="shape-btn" style="background:#dc2626;" onclick="selectWhotShape('Circle')">Circle</button>
            <button class="shape-btn" style="background:#16a34a;" onclick="selectWhotShape('Triangle')">Triangle</button>
            <button class="shape-btn" style="background:#2563eb;" onclick="selectWhotShape('Cross')">Cross</button>
            <button class="shape-btn" style="background:#d97706;" onclick="selectWhotShape('Square')">Square</button>
            <button class="shape-btn" style="background:#7c3aed;" onclick="selectWhotShape('Star')">Star</button>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    let connections = []; // Host keeps track of all client connections
    let isHost = false;
    let myName = "";
    let myId = "";
    let roomCode = "";

    // Game state (Host manages, clients receive updates)
    let gState = {
        players: [], // {id, name, handCount, hand}
        deck: [],
        pile: [],
        currentTurnIndex: 0,
        activeShape: '',
        activeVal: 0,
        gameOver: false
    };

    const baseDeck = [
        {shape: 'Circle', val: 1}, {shape: 'Circle', val: 2}, {shape: 'Circle', val: 3}, {shape: 'Circle', val: 4}, {shape: 'Circle', val: 5}, {shape: 'Circle', val: 7}, {shape: 'Circle', val: 8},
        {shape: 'Triangle', val: 1}, {shape: 'Triangle', val: 2}, {shape: 'Triangle', val: 3}, {shape: 'Triangle', val: 4}, {shape: 'Triangle', val: 5}, {shape: 'Triangle', val: 7}, {shape: 'Triangle', val: 8},
        {shape: 'Cross', val: 1}, {shape: 'Cross', val: 2}, {shape: 'Cross', val: 3}, {shape: 'Cross', val: 5}, {shape: 'Cross', val: 7},
        {shape: 'Square', val: 1}, {shape: 'Square', val: 2}, {shape: 'Square', val: 3}, {shape: 'Square', val: 5}, {shape: 'Square', val: 7},
        {shape: 'Star', val: 1}, {shape: 'Star', val: 2}, {shape: 'Star', val: 3}, {shape: 'Star', val: 5}, {shape: 'Star', val: 7},
        {shape: 'Whot', val: 20}, {shape: 'Whot', val: 20}, {shape: 'Whot', val: 20}
    ];

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function hostGame() {
        myName = document.getElementById('player-name').value.trim() || "Host";
        isHost = true;
        roomCode = Math.floor(1000 + Math.random() * 9000).toString();
        
        peer = new Peer("dot40-whot-" + roomCode);
        peer.on('open', (id) => {
            myId = id;
            gState.players = [{ id: myId, name: myName, hand: [] }];
            updateWaitingRoom();
            switchScreen('waiting-room');
            document.getElementById('display-room-code').innerText = roomCode;
        });

        peer.on('connection', (c) => {
            if (gState.players.length >= 4) {
                c.on('open', () => c.send({ type: 'ERROR', msg: 'Room is full (Max 4 players).' }));
                setTimeout(() => c.close(), 500);
                return;
            }

            connections.push(c);
            c.on('data', (data) => handleHostReceiveData(c, data));
            c.on('close', () => {
                connections = connections.filter(conn => conn !== c);
                gState.players = gState.players.filter(p => p.id !== c.peer);
                updateWaitingRoom();
                broadcastLobbyState();
            });
        });
    }

    function joinGame() {
        myName = document.getElementById('player-name').value.trim() || "Player";
        roomCode = document.getElementById('room-code-input').value.trim();
        if (!roomCode) return alert("Enter a valid room code.");
        isHost = false;

        peer = new Peer();
        peer.on('open', (id) => {
            myId = id;
            conn = peer.connect("dot40-whot-" + roomCode);
            
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: myName, id: myId });
                switchScreen('waiting-room');
                document.getElementById('display-room-code').innerText = roomCode;
            });

            conn.on('data', (data) => handleClientReceiveData(data));
            conn.on('error', (err) => alert("Connection error: " + err));
        });
    }

    function updateWaitingRoom() {
        let listHtml = '';
        gState.players.forEach(p => {
            listHtml += `<div class="player-chip">${p.name} ${p.id === myId ? '(You)' : ''}</div>`;
        });
        document.getElementById('waiting-players-list').innerHTML = listHtml;

        if (isHost) {
            let count = gState.players.length;
            let msg = document.getElementById('host-waiting-msg');
            let startBtn = document.getElementById('start-match-btn');
            
            if (count < 2) {
                msg.innerText = "Waiting for at least 1 more player to join (2-4 players supported)...";
                startBtn.style.display = 'none';
            } else {
                msg.innerText = `Ready to start with ${count} players!`;
                startBtn.style.display = 'inline-block';
            }
        } else {
            document.getElementById('host-waiting-msg').innerText = "Waiting for host to start the game...";
        }
    }

    function broadcastLobbyState() {
        if (!isHost) return;
        connections.forEach(c => {
            c.send({ type: 'LOBBY_UPDATE', players: gState.players });
        });
    }

    function handleHostReceiveData(c, data) {
        if (data.type === 'JOIN') {
            gState.players.push({ id: data.id, name: data.name, hand: [] });
            updateWaitingRoom();
            broadcastLobbyState();
        } else if (data.type === 'ACTION') {
            processPlayerAction(data.playerId, data.action);
        }
    }

    function handleClientReceiveData(data) {
        if (data.type === 'LOBBY_UPDATE') {
            gState.players = data.players;
            updateWaitingRoom();
        } else if (data.type === 'START_GAME') {
            switchScreen('game-screen');
            document.getElementById('room-info-display').innerText = `Room: ${roomCode}`;
        } else if (data.type === 'STATE_UPDATE') {
            gState = data.state;
            renderGame();
        }
    }

    function hostStartGame() {
        if (gState.players.length < 2) return;
        
        // Setup Deck & Hands
        let deck = [...baseDeck].sort(() => Math.random() - 0.5);
        gState.players.forEach(p => {
            p.hand = [];
            for (let i = 0; i < 4; i++) p.hand.push(deck.pop());
        });

        let firstCard = deck.pop();
        while(firstCard.shape === 'Whot') {
            deck.unshift(firstCard);
            firstCard = deck.pop();
        }

        gState.deck = deck;
        gState.pile = [firstCard];
        gState.activeShape = firstCard.shape;
        gState.activeVal = firstCard.val;
        gState.currentTurnIndex = 0;
        gState.gameOver = false;

        // Notify clients
        connections.forEach(c => c.send({ type: 'START_GAME' }));
        switchScreen('game-screen');
        document.getElementById('room-info-display').innerText = `Room: ${roomCode}`;
        broadcastGameState();
        renderGame();
    }

    function broadcastGameState() {
        if (!isHost) return;
        connections.forEach(c => {
            c.send({ type: 'STATE_UPDATE', state: gState });
        });
    }

    function renderGame() {
        // Deck count
        document.getElementById('deck-count').innerText = `${gState.deck.length} left`;

        // Active Card
        const topCard = gState.pile[gState.pile.length - 1];
        let activeHtml = renderCardHTML(topCard);
        if (topCard.shape === 'Whot') {
            activeHtml += `<div style="position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 11px; background: rgba(0,0,0,0.6); color: #fff;">Called: ${gState.activeShape}</div>`;
        }
        document.getElementById('active-card-container').innerHTML = activeHtml;

        // Turn indicator
        let currentTurnPlayer = gState.players[gState.currentTurnIndex];
        let isMyTurn = currentTurnPlayer.id === myId;
        
        if (isMyTurn) {
            document.getElementById('turn-indicator').innerText = "YOUR TURN!";
            document.getElementById('turn-indicator').style.color = "#10b981";
        } else {
            document.getElementById('turn-indicator').innerText = `${currentTurnPlayer.name}'s turn...`;
            document.getElementById('turn-indicator').style.color = "#facc15";
        }

        // My hand
        let me = gState.players.find(p => p.id === myId);
        if (me) {
            document.getElementById('my-name-label').innerText = `${me.name.toUpperCase()} (${me.hand.length} CARDS)`;
            let handHtml = '';
            me.hand.forEach((card, idx) => {
                handHtml += `<div onclick="playCard(${idx})">${renderCardHTML(card)}</div>`;
            });
            document.getElementById('player-hand').innerHTML = handHtml;
        }

        if (gState.gameOver) {
            alert("Game Over!");
        }
    }

    function renderCardHTML(card) {
        const shapeClass = card.shape.toLowerCase();
        let symbol = card.shape === 'Whot' ? '★' : card.shape[0];
        return `<div class="card ${shapeClass}">
                    <div class="card-top">${card.val}</div>
                    <div class="card-center">${symbol}</div>
                    <div class="card-bottom">${card.val}</div>
                </div>`;
    }

    function isValidMove(card) {
        if (card.shape === 'Whot') return true;
        if (card.shape === gState.activeShape) return true;
        if (card.val === gState.activeVal) return true;
        return false;
    }

    function playCard(index) {
        let currentTurnPlayer = gState.players[gState.currentTurnIndex];
        if (currentTurnPlayer.id !== myId) return alert("Not your turn!");

        let me = gState.players.find(p => p.id === myId);
        let card = me.hand[index];

        if (!isValidMove(card)) return alert("Invalid move! Match active shape or value.");

        if (isHost) {
            processPlayerAction(myId, { type: 'PLAY', index: index });
        } else {
            conn.send({ type: 'ACTION', playerId: myId, action: { type: 'PLAY', index: index } });
        }
    }

    function drawCard() {
        let currentTurnPlayer = gState.players[gState.currentTurnIndex];
        if (currentTurnPlayer.id !== myId) return alert("Not your turn!");

        if (isHost) {
            processPlayerAction(myId, { type: 'DRAW' });
        } else {
            conn.send({ type: 'ACTION', playerId: myId, action: { type: 'DRAW' } });
        }
    }

    function selectWhotShape(shape) {
        document.getElementById('whot-modal').style.display = 'none';
        if (isHost) {
            processPlayerAction(myId, { type: 'WHOT_SHAPE', shape: shape });
        } else {
            conn.send({ type: 'ACTION', playerId: myId, action: { type: 'WHOT_SHAPE', shape: shape } });
        }
    }

    function processPlayerAction(playerId, action) {
        let pIndex = gState.players.findIndex(p => p.id === playerId);
        if (pIndex !== gState.currentTurnIndex) return;

        let player = gState.players[pIndex];

        if (action.type === 'PLAY') {
            let card = player.hand.splice(action.index, 1)[0];
            gState.pile.push(card);

            if (player.hand.length === 0) {
                gState.gameOver = true;
                broadcastGameState();
                renderGame();
                alert(`${player.name} won the game!`);
                return;
            }

            if (card.shape === 'Whot') {
                if (playerId === myId) {
                    document.getElementById('whot-modal').style.display = 'flex';
                } else {
                    // Host picks random shape if client played Whot
                    let shapes = ['Circle', 'Triangle', 'Cross', 'Square', 'Star'];
                    gState.activeShape = shapes[Math.floor(Math.random() * shapes.length)];
                    gState.activeVal = 20;
                    advanceTurn();
                }
                return;
            } else {
                gState.activeShape = card.shape;
                gState.activeVal = card.val;
                advanceTurn();
            }
        } else if (action.type === 'DRAW') {
            if (gState.deck.length === 0) {
                let top = gState.pile.pop();
                gState.deck = [...gState.pile].sort(() => Math.random() - 0.5);
                gState.pile = [top];
            }
            if (gState.deck.length > 0) {
                player.hand.push(gState.deck.pop());
            }
            advanceTurn();
        } else if (action.type === 'WHOT_SHAPE') {
            gState.activeShape = action.shape;
            gState.activeVal = 20;
            advanceTurn();
        }
    }

    function advanceTurn() {
        gState.currentTurnIndex = (gState.currentTurnIndex + 1) % gState.players.length;
        broadcastGameState();
        renderGame();
    }
</script>
</body>
</html>
