<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot.40 WHOT - Hadriel & Ajayi</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0f4d2a;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP HEADER BAR */
    .header-bar {
      background: #092c18;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      color: #facc15;
      letter-spacing: 1px;
    }

    .brand-sub {
      font-size: 10px;
      color: #86efac;
      font-weight: bold;
    }

    .turn-pill {
      background: #1e3a29;
      border: 1px solid #34d399;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    /* MODES & CHEATS CONTROL BAR */
    .nav-controls {
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 8px;
    }

    .nav-btn {
      background: #15803d;
      color: #ffffff;
      border: 1px solid #4ade80;
      padding: 5px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-btn.active {
      background: #facc15;
      color: #000000;
      border-color: #facc15;
    }

    .btn-cheat {
      background: #dc2626;
      border-color: #f87171;
    }

    /* MAIN BOARD AREA */
    .game-board {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* MULTIPLAYER LOBBY OVERLAY */
    .mp-lobby {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #0b2214;
      padding: 25px;
      border-radius: 12px;
      border: 2px solid #34d399;
      z-index: 50;
      flex-direction: column;
      gap: 15px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-align: center;
    }

    .mp-lobby h3 {
      color: #facc15;
      font-size: 16px;
    }

    .mp-lobby input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1e3a29;
      background: #1e293b;
      color: white;
      font-size: 14px;
      width: 100%;
    }

    /* BADGES */
    .badge {
      background: #0b2214;
      border-radius: 25px;
      padding: 8px 16px 8px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .badge-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #1e3a29;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .badge-info {
      display: flex;
      flex-direction: column;
    }

    .badge-name {
      font-weight: 800;
      font-size: 14px;
      color: #ffffff;
    }

    .badge-sub {
      font-size: 11px;
      color: #38bdf8;
    }

    .badge-opp { align-self: flex-start; }
    .badge-self { align-self: flex-end; }

    /* CARD RACKS */
    .rack {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
      padding: 10px;
    }

    .rack .card {
      margin-left: -25px;
      transition: transform 0.2s;
    }

    .rack .card:first-child {
      margin-left: 0;
    }

    .rack .card:hover {
      transform: translateY(-15px);
      z-index: 10;
    }

    /* CENTER AREA */
    .center-table {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 30px;
      align-items: center;
      text-align: center;
    }

    .stack-label {
      font-size: 11px;
      font-weight: 800;
      color: #86efac;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    /* CARDS */
    .card {
      width: 80px;
      height: 120px;
      border-radius: 10px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      position: relative;
      user-select: none;
      cursor: pointer;
    }

    .card.back {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: 2px solid #60a5fa;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card.back .watermark {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 900;
      font-size: 15px;
      transform: rotate(-30deg);
      letter-spacing: 1px;
    }

    .card.face {
      background: #fcfcfc;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
    }

    .card.whot-20 {
      background: #facc15;
      border: 2px solid #eab308;
    }

    .num-top { font-size: 15px; font-weight: 900; }
    .num-bottom { font-size: 13px; font-weight: 900; text-align: right; }
    .symbol-center {
      text-align: center;
      font-size: 34px;
      font-weight: normal;
      line-height: 1;
    }

    /* LOG OVERLAY */
    .log-pill {
      position: absolute;
      bottom: 80px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      color: #86efac;
      max-width: 260px;
      max-height: 60px;
      overflow-y: auto;
    }

    /* CHEATS MODAL (SECRET TERMINAL) */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 99;
    }

    .modal-box {
      background: #0f172a;
      padding: 24px;
      border-radius: 12px;
      border: 2px solid #dc2626;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.3);
    }

    .modal-box h3 {
      color: #ef4444;
      text-align: center;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .cheat-input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #dc2626;
      background: #1e293b;
      color: #f87171;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }

    .cheat-msg {
      font-size: 11px;
      text-align: center;
      min-height: 16px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <div class="header-bar">
    <div>
      <div class="brand-title">PLAYWHOT</div>
      <div class="brand-sub">Dot.40 • Hadriel & Ajayi</div>
    </div>
    <div class="turn-pill" id="turn-indicator">Your Turn</div>
  </div>

  <!-- MODES & CHEATS BAR -->
  <div class="nav-controls">
    <button class="nav-btn active" id="mode-sp" onclick="changeMode('sp')">Single Player</button>
    <button class="nav-btn" id="mode-mp" onclick="changeMode('mp')">Online Multiplayer</button>
    <button class="nav-btn" id="mode-pr" onclick="changeMode('pr')">Practice Mode</button>
    <button class="nav-btn btn-cheat" onclick="toggleCheats(true)">⚡ Cheats</button>
  </div>

  <!-- GAME BOARD -->
  <div class="game-board">

    <!-- MULTIPLAYER LOBBY -->
    <div class="mp-lobby" id="mp-lobby">
      <h3>Join Online Room</h3>
      <input type="text" id="mp-name" placeholder="Enter Your Name">
      <!-- DEFAULT ROOM VALUE IS SET TO 1 -->
      <input type="text" id="mp-room" value="1" placeholder="Enter Room Number">
      <button class="nav-btn" style="width: 100%; padding: 12px; font-size: 14px;" onclick="joinRoom()">Join Room</button>
    </div>

    <!-- OPPONENT AREA -->
    <div>
      <div class="badge badge-opp">
        <div class="badge-icon" id="opp-icon">🤖</div>
        <div class="badge-info">
          <span class="badge-name" id="opp-label">Computer Pro</span>
          <span class="badge-sub" id="opp-count">5 cards remaining</span>
        </div>
      </div>
      <div class="rack" id="opp-rack" style="margin-top: -15px;"></div>
    </div>

    <!-- CENTER PILES -->
    <div class="center-table">
      <div>
        <div class="stack-label">MARKET</div>
        <div class="card back" onclick="playerDraw()">
          <div class="watermark">WHOT!</div>
        </div>
      </div>

      <div>
        <div class="stack-label">PLAYED STACK</div>
        <div id="played-card-slot"></div>
      </div>
    </div>

    <div class="log-pill" id="log-box">Welcome to Dot.40 Whot!</div>

    <!-- PLAYER AREA -->
    <div>
      <div class="rack" id="player-rack" style="margin-bottom: -15px;"></div>
      <div class="badge badge-self">
        <div class="badge-icon" style="background: #eab308; color:#000;">👤</div>
        <div class="badge-info">
          <span class="badge-name" id="player-label">Player 1</span>
          <span class="badge-sub" id="player-count">5 cards remaining</span>
        </div>
      </div>
    </div>

  </div>

  <!-- CHEATS MODAL (SECRET TERMINAL) -->
  <div class="modal" id="cheat-modal">
    <div class="modal-box">
      <h3>🔒 SECRET CHEAT TERMINAL</h3>
      <input type="text" class="cheat-input" id="cheat-code-input" placeholder="ENTER SECRET CODE..." onkeydown="if(event.key==='Enter') submitCheat()">
      <div class="cheat-msg" id="cheat-msg">Type secret code and press Enter</div>
      <button class="nav-btn btn-cheat" style="padding: 10px;" onclick="submitCheat()">Activate Cheat</button>
      <button class="nav-btn" style="background: #334155; border-color: #475569;" onclick="toggleCheats(false)">Close</button>
    </div>
  </div>

  <script>
    const shapes = ["Circle", "Triangle", "Cross", "Square", "Star"];
    const symbols = { "Circle": "○", "Triangle": "△", "Cross": "+", "Square": "□", "Star": "☆", "Whot": "W" };

    let deck = [];
    let pHand = [];
    let cpuHand = [];
    let topCard = null;
    let gameMode = "sp";
    let pTurn = true;
    let peekCPU = false;

    function buildDeck() {
      deck = [];
      shapes.forEach(s => {
        [1, 2, 3, 4, 5, 7, 8, 10, 11, 12, 13, 14].forEach(n => deck.push({ shape: s, num: n }));
      });
      for (let i = 0; i < 4; i++) deck.push({ shape: "Whot", num: 20 });
      deck.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      buildDeck();
      pHand = deck.splice(0, 5);
      cpuHand = deck.splice(0, 5);
      topCard = deck.pop();
      pTurn = true;
      writeLog("Match started!");
      updateUI();
    }

    function changeMode(m) {
      gameMode = m;
      document.getElementById('mode-sp').classList.toggle('active', m === 'sp');
      document.getElementById('mode-mp').classList.toggle('active', m === 'mp');
      document.getElementById('mode-pr').classList.toggle('active', m === 'pr');

      document.getElementById('mp-lobby').style.display = (m === 'mp') ? 'flex' : 'none';

      if (m === 'sp') {
        document.getElementById('turn-indicator').innerText = "Your Turn";
        document.getElementById('player-label').innerText = "Player 1";
        document.getElementById('opp-label').innerText = "Computer Pro";
        document.getElementById('opp-icon').innerText = "🤖";
        initGame();
      } else if (m === 'pr') {
        document.getElementById('turn-indicator').innerText = "Practice Mode";
        initGame();
      } else if (m === 'mp') {
        document.getElementById('turn-indicator').innerText = "Enter Room Details...";
        pHand = []; cpuHand = []; topCard = null;
        updateUI();
      }
    }

    function joinRoom() {
      const name = document.getElementById('mp-name').value || "Player 1";
      const roomNum = document.getElementById('mp-room').value || "1";

      document.getElementById('mp-lobby').style.display = 'none';
      
      document.getElementById('player-label').innerText = name;
      document.getElementById('opp-label').innerText = "Opponent";
      document.getElementById('opp-icon').innerText = "🌐";
      document.getElementById('turn-indicator').innerText = "Waiting for an opponent to join...";
      
      writeLog(`${name} joined Room ${roomNum}. Waiting for Player 2...`);
    }

    function updateUI() {
      if(gameMode !== 'mp' || pHand.length > 0) {
        document.getElementById('turn-indicator').innerText = pTurn ? "Your Turn" : "Opponent Turn";
      }
      
      if(topCard) {
        document.getElementById('played-card-slot').innerHTML = renderCardHTML(topCard);
      } else {
        document.getElementById('played-card-slot').innerHTML = '';
      }

      const pRack = document.getElementById('player-rack');
      pRack.innerHTML = '';
      pHand.forEach((c, idx) => {
        const div = document.createElement('div');
        div.innerHTML = renderCardHTML(c);
        div.onclick = () => playCard(idx);
        pRack.appendChild(div);
      });
      document.getElementById('player-count').innerText = `${pHand.length} cards remaining`;

      const cpuRack = document.getElementById('opp-rack');
      cpuRack.innerHTML = '';
      cpuHand.forEach(c => {
        const div = document.createElement('div');
        if (peekCPU) {
          div.innerHTML = renderCardHTML(c);
        } else {
          div.className = "card back";
          div.innerHTML = `<div class="watermark">WHOT!</div>`;
        }
        cpuRack.appendChild(div);
      });
      document.getElementById('opp-count').innerText = `${cpuHand.length} cards remaining`;

      if (gameMode === 'pr' && pTurn && pHand.length > 0) givePracticeHint();
    }

    function renderCardHTML(c) {
      if(!c) return '';
      const isWhot = c.num === 20;
      return `
        <div class="card face ${isWhot ? 'whot-20' : ''}">
          <div class="num-top">${c.num}</div>
          <div class="symbol-center">${symbols[c.shape]}</div>
          <div class="num-bottom">${c.num}</div>
        </div>
      `;
    }

    function playCard(idx) {
      if (!pTurn || gameMode === 'mp') return writeLog("Wait for your turn!");
      const c = pHand[idx];
      if (c.num === 20 || c.shape === topCard.shape || c.num === topCard.num) {
        pHand.splice(idx, 1);
        topCard = c;
        writeLog(`You played ${c.num} ${c.shape}`);
        
        if (checkEnd()) return;

        if (c.num === 1) {
          writeLog("Hold On! Play again.");
        } else {
          pTurn = false;
          setTimeout(cpuTurn, 1000);
        }
        updateUI();
      } else {
        writeLog("Card doesn't match top stack!");
      }
    }

    function playerDraw() {
      if (!pTurn || deck.length === 0 || gameMode === 'mp') return;
      pHand.push(deck.pop());
      writeLog("You drew a card.");
      pTurn = false;
      updateUI();
      setTimeout(cpuTurn, 1000);
    }

    function cpuTurn() {
      if (cpuHand.length === 0) return;
      let matchIdx = cpuHand.findIndex(c => c.num === 20 || c.shape === topCard.shape || c.num === topCard.num);

      if (matchIdx !== -1) {
        let c = cpuHand.splice(matchIdx, 1)[0];
        topCard = c;
        writeLog(`Opponent played ${c.num} ${c.shape}`);
        if (checkEnd()) return;
        if (c.num === 1) {
          writeLog("Opponent played Hold On!");
          setTimeout(cpuTurn, 1000);
          return;
        }
      } else if (deck.length > 0) {
        cpuHand.push(deck.pop());
        writeLog("Opponent drew a card.");
      }

      pTurn = true;
      updateUI();
    }

    function givePracticeHint() {
      let matches = pHand.filter(c => c.num === 20 || c.shape === topCard.shape || c.num === topCard.num);
      writeLog(`[Hint]: ${matches.length} playable card(s) available.`);
    }

    function checkEnd() {
      if (pHand.length === 0) { alert("You Won!"); initGame(); return true; }
      if (cpuHand.length === 0) { alert("Opponent Won!"); initGame(); return true; }
      return false;
    }

    function writeLog(t) {
      const b = document.getElementById('log-box');
      b.innerText = t + "\n" + b.innerText;
    }

    function toggleCheats(show) { 
      document.getElementById('cheat-modal').style.display = show ? 'flex' : 'none'; 
      if(show) {
        document.getElementById('cheat-code-input').value = '';
        document.getElementById('cheat-msg').innerText = 'Type secret code and press Enter';
        document.getElementById('cheat-msg').style.color = '#94a3b8';
      }
    }

    /* SECRET CHEATS SYSTEM */
    function submitCheat() {
      const code = document.getElementById('cheat-code-input').value.trim().toUpperCase();
      const msg = document.getElementById('cheat-msg');

      const cheatsMap = {
        "PEEK": () => { peekCPU = !peekCPU; return "Peek Toggled!"; },
        "WHOT20": () => { pHand.push({ shape: "Whot", num: 20 }); return "Whot 20 Card Added!"; },
        "DRAW5": () => { if (deck.length >= 5) cpuHand.push(...deck.splice(0, 5)); return "Opponent Forced to Draw 5!"; },
        "INSTAWIN": () => { pHand = []; checkEnd(); return "Instant Victory Executed!"; },
        "SWAP": () => { let t = [...pHand]; pHand = [...cpuHand]; cpuHand = t; return "Hands Swapped Successfully!"; },
        "SKIP": () => { pTurn = true; return "Opponent Skipped!"; },
        "HOLDON": () => { pHand.push({ shape: "Circle", num: 1 }); return "Hold On Card Added!"; },
        "PEEKDECK": () => { return deck.length > 0 ? `Market Top: ${deck[deck.length-1].num} ${deck[deck.length-1].shape}` : "Deck Empty!"; },
        "WIPE": () => { cpuHand = []; checkEnd(); return "Opponent Hand Wiped!"; },
        "INFINITE": () => { pTurn = true; return "Infinite Turns Enabled!"; }
      };

      if (cheatsMap[code]) {
        const result = cheatsMap[code]();
        msg.innerText = "⚡ SUCCESS: " + result;
        msg.style.color = "#4ade80";
        updateUI();
        setTimeout(() => toggleCheats(false), 1200);
      } else {
        msg.innerText = "❌ ACCESS DENIED: Invalid Cheat Code";
        msg.style.color = "#f87171";
      }
    }

    initGame();
  </script>
</body>
</html>
