<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot.40 WHOT - Hadriel & Ajayi</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0d381e; /* Classic Whot Dark Green Felt Background */
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* TOP HEADER & NAVBAR */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: rgba(0, 0, 0, 0.2);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 900;
      color: #facc15;
      letter-spacing: 1px;
    }

    .sub-brand {
      font-size: 11px;
      color: #a7f3d0;
      font-weight: normal;
    }

    .status-pill {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* MODE BUTTONS */
    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 8px;
      background: rgba(0,0,0,0.3);
    }

    .mode-btn {
      background: #166534;
      color: white;
      border: 1px solid #22c55e;
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #facc15;
      color: #000;
      border-color: #facc15;
    }

    .btn-cheat-open {
      background: #ef4444;
      border-color: #f87171;
    }

    /* GREEN FELT GAME BOARD */
    .board {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* PLAYER BADGES */
    .player-badge {
      background: #111827;
      padding: 8px 18px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      width: fit-content;
    }

    .opponent-badge {
      align-self: flex-start;
    }

    .player-badge.self {
      align-self: flex-end;
    }

    /* PLAY MAT CENTER */
    .center-mat {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      gap: 20px;
      align-items: center;
    }

    /* CARDS STYLING */
    .card {
      width: 90px;
      height: 130px;
      border-radius: 10px;
      box-shadow: 0 10px 15px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-10px);
    }

    .card.deck-back {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 3px solid #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .card.face {
      background: white;
      color: #1e293b;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #cbd5e1;
    }

    .card-num {
      font-size: 16px;
      font-weight: 900;
    }

    .card-symbol {
      text-align: center;
      font-size: 32px;
    }

    .card-shape-name {
      text-align: right;
      font-size: 10px;
      font-weight: bold;
      color: #64748b;
    }

    /* HAND RACKS */
    .hand-rack {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      max-width: 80%;
      padding: 10px;
    }

    .opp-hand-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .self-hand-container {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 15px;
    }

    /* LOG OVERLAY */
    .log-box {
      position: absolute;
      bottom: 75px;
      left: 20px;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 8px;
      max-width: 300px;
      font-size: 12px;
      color: #a7f3d0;
      max-height: 80px;
      overflow-y: auto;
    }

    /* CHEATS MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      border: 2px solid #ef4444;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cheat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .cheat-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div>
      <div class="brand-title">DOT.40 WHOT ONLINE</div>
      <div class="sub-brand">By Hadriel & Ajayi</div>
    </div>
    <div class="status-pill" id="status-text">Single Player Active</div>
  </div>

  <!-- MODE NAVBAR -->
  <div class="mode-bar">
    <button class="mode-btn active" id="btn-sp" onclick="setMode('sp')">Single Player</button>
    <button class="mode-btn" id="btn-mp" onclick="setMode('mp')">Online Multiplayer</button>
    <button class="mode-btn" id="btn-pr" onclick="setMode('pr')">Practice Mode</button>
    <button class="mode-btn btn-cheat-open" onclick="openCheats()">⚡ 10 Cheats</button>
  </div>

  <!-- BOARD -->
  <div class="board">
    <!-- OPPONENT -->
    <div class="opp-hand-container">
      <div class="player-badge opponent-badge">
        🤖 <span id="opp-name">Opponent</span> (<span id="opp-count">5</span>)
      </div>
      <div class="hand-rack" id="opp-rack"></div>
    </div>

    <!-- CENTER CARDS -->
    <div class="center-mat">
      <div class="card deck-back" onclick="drawCard()">
        <div style="text-align:center;">
          <div>DOT.40</div>
          <div style="font-size:10px;" id="deck-left">30</div>
        </div>
      </div>
      <div id="played-card-slot"></div>
    </div>

    <!-- LOGS -->
    <div class="log-box" id="log-display">Welcome to Dot.40 Whot!</div>

    <!-- PLAYER -->
    <div class="self-hand-container">
      <div class="hand-rack" id="self-rack"></div>
      <div class="player-badge self">
        👤 Player 1
      </div>
    </div>
  </div>

  <!-- CHEATS MODAL -->
  <div class="modal" id="cheat-modal">
    <div class="modal-content">
      <h3 style="color:#ef4444; text-align:center;">⚡ Dot.40 10 Cheats Menu</h3>
      <div class="cheat-grid">
        <button class="cheat-btn" onclick="cheatPeek()">1. 👁️ Peek Opponent</button>
        <button class="cheat-btn" onclick="cheatAddWhot()">2. 🃏 Add Whot 20</button>
        <button class="cheat-btn" onclick="cheatDraw5()">3. 🎁 Opponent Draw 5</button>
        <button class="cheat-btn" onclick="cheatInstantWin()">4. 🚀 Instant Win</button>
        <button class="cheat-btn" onclick="cheatSwap()">5. 🔄 Swap Hands</button>
        <button class="cheat-btn" onclick="cheatSkip()">6. 🚫 Skip Opponent</button>
        <button class="cheat-btn" onclick="cheatHoldOn()">7. 👑 Give Hold On</button>
        <button class="cheat-btn" onclick="cheatPeekDeck()">8. 🔮 Peek Market Top</button>
        <button class="cheat-btn" onclick="cheatWipeOpp()">9. 🔒 Wipe Opponent</button>
        <button class="cheat-btn" onclick="cheatInfinite()">10. ⚡ Infinite Turns</button>
      </div>
      <button class="mode-btn" style="margin-top:10px;" onclick="closeCheats()">Close</button>
    </div>
  </div>

  <script>
    const shapes = ["Circle", "Triangle", "Cross", "Square", "Star"];
    const symbols = { "Circle": "🔴", "Triangle": "🔺", "Cross": "✖️", "Square": "⬛", "Star": "⭐", "Whot": "🃏" };

    let deck = [];
    let myHand = [];
    let oppHand = [];
    let topCard = null;
    let mode = 'sp'; // sp, mp, pr
    let myTurn = true;
    let oppVisible = false;

    function buildDeck() {
      deck = [];
      shapes.forEach(s => {
        [1, 2, 3, 4, 5, 7, 8, 10, 11, 12, 13, 14].forEach(n => deck.push({ shape: s, num: n }));
      });
      for(let i=0; i<4; i++) deck.push({ shape: "Whot", num: 20 });
      deck.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      buildDeck();
      myHand = deck.splice(0, 5);
      oppHand = deck.splice(0, 5);
      topCard = deck.pop();
      myTurn = true;
      log("Game started!");
      render();
    }

    function setMode(m) {
      mode = m;
      document.getElementById('btn-sp').classList.toggle('active', mode==='sp');
      document.getElementById('btn-mp').classList.toggle('active', mode==='mp');
      document.getElementById('btn-pr').classList.toggle('active', mode==='pr');

      const status = document.getElementById('status-text');
      if(mode==='sp') status.innerText = "Single Player Active";
      if(mode==='pr') status.innerText = "Practice Mode Active";
      if(mode==='mp') status.innerText = "Waiting for an opponent to join...";

      initGame();
    }

    function render() {
      document.getElementById('deck-left').innerText = deck.length;
      document.getElementById('played-card-slot').innerHTML = cardHTML(topCard);

      // Render My Hand
      const selfRack = document.getElementById('self-rack');
      selfRack.innerHTML = '';
      myHand.forEach((c, idx) => {
        const div = document.createElement('div');
        div.innerHTML = cardHTML(c);
        div.onclick = () => playCard(idx);
        selfRack.appendChild(div);
      });

      // Render Opponent Hand
      const oppRack = document.getElementById('opp-rack');
      oppRack.innerHTML = '';
      document.getElementById('opp-count').innerText = oppHand.length;
      oppHand.forEach(c => {
        const div = document.createElement('div');
        if(oppVisible) {
          div.innerHTML = cardHTML(c);
        } else {
          div.className = 'card deck-back';
          div.innerHTML = '<div>DOT.40</div>';
        }
        oppRack.appendChild(div);
      });

      if(mode==='pr' && myTurn) giveHint();
    }

    function cardHTML(c) {
      return `
        <div class="card face">
          <div class="card-num">${c.num}</div>
          <div class="card-symbol">${symbols[c.shape]}</div>
          <div class="card-shape-name">${c.shape}</div>
        </div>
      `;
    }

    function playCard(idx) {
      if(!myTurn) return;
      const c = myHand[idx];
      if(c.num === 20 || c.shape === topCard.shape || c.num === topCard.num) {
        myHand.splice(idx, 1);
        topCard = c;
        log(`You played ${c.num} ${c.shape}`);

        if(checkWin()) return;

        if(c.num === 1) {
          log("Hold On! Play again.");
        } else {
          myTurn = false;
          setTimeout(oppTurn, 1000);
        }
        render();
      } else {
        log("Cannot play that card!");
      }
    }

    function drawCard() {
      if(!myTurn || deck.length === 0) return;
      myHand.push(deck.pop());
      log("You drew a card.");
      myTurn = false;
      render();
      setTimeout(oppTurn, 1000);
    }

    function oppTurn() {
      if(oppHand.length === 0) return;
      let validIdx = oppHand.findIndex(c => c.num === 20 || c.shape === topCard.shape || c.num === topCard.num);

      if(validIdx !== -1) {
        let c = oppHand.splice(validIdx, 1)[0];
        topCard = c;
        log(`Opponent played ${c.num} ${c.shape}`);
        if(checkWin()) return;
        if(c.num === 1) {
          log("Opponent played Hold On!");
          setTimeout(oppTurn, 1000);
          return;
        }
      } else if(deck.length > 0) {
        oppHand.push(deck.pop());
        log("Opponent drew a card.");
      }

      myTurn = true;
      render();
    }

    function giveHint() {
      let matches = myHand.filter(c => c.num === 20 || c.shape === topCard.shape || c.num === topCard.num);
      log(`[Practice]: ${matches.length} playable card(s) in hand.`);
    }

    function checkWin() {
      if(myHand.length === 0) { alert("You Won!"); initGame(); return true; }
      if(oppHand.length === 0) { alert("Opponent Won!"); initGame(); return true; }
      return false;
    }

    function log(m) {
      const el = document.getElementById('log-display');
      el.innerText = m + "\n" + el.innerText;
    }

    function openCheats() { document.getElementById('cheat-modal').style.display = 'flex'; }
    function closeCheats() { document.getElementById('cheat-modal').style.display = 'none'; }

    function cheatPeek() { oppVisible = !oppVisible; render(); closeCheats(); }
    function cheatAddWhot() { myHand.push({shape:"Whot", num:20}); render(); closeCheats(); }
    function cheatDraw5() { if(deck.length>=5) oppHand.push(...deck.splice(0,5)); render(); closeCheats(); }
    function cheatInstantWin() { myHand = []; checkWin(); closeCheats(); }
    function cheatSwap() { let t=[...myHand]; myHand=[...oppHand]; oppHand=t; render(); closeCheats(); }
    function cheatSkip() { myTurn = true; log("Skipped opponent!"); render(); closeCheats(); }
    function cheatHoldOn() { myHand.push({shape:"Circle", num:1}); render(); closeCheats(); }
    function cheatPeekDeck() { if(deck.length>0) alert(`Next card: ${deck[deck.length-1].num} ${deck[deck.length-1].shape}`); closeCheats(); }
    function cheatWipeOpp() { oppHand = []; checkWin(); closeCheats(); }
    function cheatInfinite() { myTurn = true; log("Infinite turns enabled!"); closeCheats(); }

    initGame();
  </script>
</body>
</html>
