<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot.40 Whot! Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        /* SETUP SCREEN */
        #setup-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 20px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #facc15;
            font-size: 36px;
            letter-spacing: 2px;
        }

        .player-select-btns {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { background: #2563eb; transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }

        /* GAME BOARD */
        #game-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .opponents-bar {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 10px;
            border-bottom: 1px solid #334155;
        }

        .opponent-box {
            background: #1e293b;
            padding: 8px 15px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #475569;
            font-size: 14px;
        }

        .opponent-box.active-turn {
            border-color: #facc15;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }

        .table-center {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            background: #134e4a;
            position: relative;
        }

        .card-pile {
            width: 90px;
            height: 130px;
            background: #334155;
            border-radius: 8px;
            border: 2px dashed #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            color: #cbd5e1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .card-pile:hover { background: #475569; }

        .active-card-display {
            width: 100px;
            height: 145px;
            background: #ffffff;
            color: #0f172a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            font-weight: bold;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            position: relative;
        }

        .player-section {
            background: #0f172a;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid #334155;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 14px;
        }

        .player-hand {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px;
            min-height: 140px;
            align-items: center;
        }

        .card {
            min-width: 90px;
            height: 130px;
            background: #ffffff;
            color: #0f172a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
            user-select: none;
            flex-shrink: 0;
        }

        .card:hover {
            transform: translateY(-10px);
            background: #f1f5f9;
        }

        .card.circle { color: #dc2626; }
        .card.triangle { color: #16a34a; }
        .card.cross { color: #2563eb; }
        .card.square { color: #d97706; }
        .card.star { color: #7c3aed; }
        .card.whot { color: #db2777; }

        .card-top { font-size: 16px; }
        .card-center { font-size: 24px; text-align: center; align-self: center; }
        .card-bottom { font-size: 16px; text-align: right; transform: rotate(180deg); }

        /* WHOT MODAL */
        #whot-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #facc15;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .shape-btns { display: flex; gap: 10px; justify-content: center; }
        .shape-btn { padding: 10px 15px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <h1>DOT.40 WHOT!</h1>
        <p>Select total number of players (2 to 4 players supported):</p>
        <div class="player-select-btns">
            <button class="btn" onclick="startGame(2)">2 Players</button>
            <button class="btn" onclick="startGame(3)">3 Players</button>
            <button class="btn" onclick="startGame(4)">4 Players</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div class="opponents-bar" id="opponents-bar">
            <!-- Opponents injected here -->
        </div>

        <div class="table-center">
            <div class="card-pile" onclick="playerDrawCard()">
                DECK<br><span id="deck-count" style="font-size: 12px; color: #94a3b8;">0 left</span>
            </div>
            <div id="active-card-container">
                <!-- Current played card shown here -->
            </div>
        </div>

        <div class="player-section">
            <div class="player-info">
                <span>YOUR HAND (<span id="player-card-count">0</span>)</span>
                <span id="game-status" style="color: #facc15;">Your Turn</span>
            </div>
            <div class="player-hand" id="player-hand">
                <!-- Player cards injected here -->
            </div>
        </div>
    </div>
</div>

<!-- WHOT SHAPE PICKER MODAL -->
<div id="whot-modal">
    <div class="modal-content">
        <h3>Choose a Shape</h3>
        <div class="shape-btns">
            <button class="shape-btn" style="background:#dc2626;" onclick="selectWhotShape('Circle')">Circle</button>
            <button class="shape-btn" style="background:#16a34a;" onclick="selectWhotShape('Triangle')">Triangle</button>
            <button class="shape-btn" style="background:#2563eb;" onclick="selectWhotShape('Cross')">Cross</button>
            <button class="shape-btn" style="background:#d97706;" onclick="selectWhotShape('Square')">Square</button>
            <button class="shape-btn" style="background:#7c3aed;" onclick="selectWhotShape('Star')">Star</button>
        </div>
    </div>
</div>

<script>
    const shapes = ['Circle', 'Triangle', 'Cross', 'Square', 'Star'];
    // Simplified standard whot deck distribution
    const baseDeck = [
        {shape: 'Circle', val: 1}, {shape: 'Circle', val: 2}, {shape: 'Circle', val: 3}, {shape: 'Circle', val: 4}, {shape: 'Circle', val: 5}, {shape: 'Circle', val: 7}, {shape: 'Circle', val: 8},
        {shape: 'Triangle', val: 1}, {shape: 'Triangle', val: 2}, {shape: 'Triangle', val: 3}, {shape: 'Triangle', val: 4}, {shape: 'Triangle', val: 5}, {shape: 'Triangle', val: 7}, {shape: 'Triangle', val: 8},
        {shape: 'Cross', val: 1}, {shape: 'Cross', val: 2}, {shape: 'Cross', val: 3}, {shape: 'Cross', val: 5}, {shape: 'Cross', val: 7},
        {shape: 'Square', val: 1}, {shape: 'Square', val: 2}, {shape: 'Square', val: 3}, {shape: 'Square', val: 5}, {shape: 'Square', val: 7},
        {shape: 'Star', val: 1}, {shape: 'Star', val: 2}, {shape: 'Star', val: 3}, {shape: 'Star', val: 5}, {shape: 'Star', val: 7},
        {shape: 'Whot', val: 20}, {shape: 'Whot', val: 20}, {shape: 'Whot', val: 20}
    ];

    let gameState = {
        numPlayers: 2,
        deck: [],
        pile: [],
        hands: [],
        currentTurn: 0, // 0 is human, 1+ are AI
        activeShape: '',
        activeVal: 0,
        gameActive: false
    };

    function startGame(count) {
        gameState.numPlayers = count;
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        initGame();
    }

    function initGame() {
        // Shuffle deck
        gameState.deck = [...baseDeck].sort(() => Math.random() - 0.5);
        gameState.hands = Array.from({length: gameState.numPlayers}, () => []);

        // Deal 4 cards to each player
        for (let i = 0; i < 4; i++) {
            for (let p = 0; p < gameState.numPlayers; p++) {
                gameState.hands[p].push(gameState.deck.pop());
            }
        }

        // Set initial active card (must not be Whot to start clean)
        let firstCard = gameState.deck.pop();
        while(firstCard.shape === 'Whot') {
            gameState.deck.unshift(firstCard);
            firstCard = gameState.deck.pop();
        }
        gameState.pile.push(firstCard);
        gameState.activeShape = firstCard.shape;
        gameState.activeVal = firstCard.val;

        gameState.currentTurn = 0;
        updateUI();
    }

    function renderCard(card, hidden = false) {
        if (hidden) {
            return `<div class="card" style="background: #334155; color: #94a3b8; justify-content: center; align-items: center;">
                        <span style="font-size: 24px;">🎴</span>
                    </div>`;
        }
        const shapeClass = card.shape.toLowerCase();
        let symbol = card.shape === 'Whot' ? '★' : card.shape[0];
        return `<div class="card ${shapeClass}">
                    <div class="card-top">${card.val}</div>
                    <div class="card-center">${symbol}</div>
                    <div class="card-bottom">${card.val}</div>
                </div>`;
    }

    function updateUI() {
        // Deck count
        document.getElementById('deck-count').innerText = `${gameState.deck.length} left`;

        // Active Card
        const topCard = gameState.pile[gameState.pile.length - 1];
        let activeHtml = renderCard(topCard);
        if (topCard.shape === 'Whot') {
            activeHtml += `<div style="position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 11px; background: rgba(0,0,0,0.6); color: #fff;">Called: ${gameState.activeShape}</div>`;
        }
        document.getElementById('active-card-container').innerHTML = activeHtml;

        // Opponents bar (Players 1 to N-1)
        let opponentsHtml = '';
        for (let i = 1; i < gameState.numPlayers; i++) {
            let activeClass = (gameState.currentTurn === i) ? 'active-turn' : '';
            opponentsHtml += `<div class="opponent-box ${activeClass}">
                <div>CPU ${i}</div>
                <div style="font-size: 12px; color: #94a3b8;">Cards: ${gameState.hands[i].length}</div>
            </div>`;
        }
        document.getElementById('opponents-bar').innerHTML = opponentsHtml;

        // Player hand
        let handHtml = '';
        gameState.hands[0].forEach((card, idx) => {
            handHtml += `<div onclick="playerPlayCard(${idx})">${renderCard(card)}</div>`;
        });
        document.getElementById('player-hand').innerHTML = handHtml;
        document.getElementById('player-card-count').innerText = gameState.hands[0].length;

        // Status
        if (gameState.currentTurn === 0) {
            document.getElementById('game-status').innerText = "Your Turn";
        } else {
            document.getElementById('game-status').innerText = `CPU ${gameState.currentTurn}'s Turn...`;
            setTimeout(runCpuTurn, 1200);
        }
    }

    function isValidMove(card) {
        if (card.shape === 'Whot') return true;
        if (card.shape === gameState.activeShape) return true;
        if (card.val === gameState.activeVal) return true;
        return false;
    }

    function playerPlayCard(index) {
        if (gameState.currentTurn !== 0) return;
        let card = gameState.hands[0][index];

        if (!isValidMove(card)) {
            alert("Invalid move! Match the active shape or card number.");
            return;
        }

        gameState.hands[0].splice(index, 1);
        gameState.pile.push(card);

        if (gameState.hands[0].length === 0) {
            alert("Congratulations! You won the game!");
            location.reload();
            return;
        }

        if (card.shape === 'Whot') {
            document.getElementById('whot-modal').style.display = 'flex';
        } else {
            gameState.activeShape = card.shape;
            gameState.activeVal = card.val;
            nextTurn();
        }
    }

    function selectWhotShape(shape) {
        gameState.activeShape = shape;
        gameState.activeVal = 20;
        document.getElementById('whot-modal').style.display = 'none';
        nextTurn();
    }

    function playerDrawCard() {
        if (gameState.currentTurn !== 0) return;
        drawCardForPlayer(0);
        nextTurn();
    }

    function drawCardForPlayer(playerIndex) {
        if (gameState.deck.length === 0) {
            // Reshuffle pile if deck is empty
            let top = gameState.pile.pop();
            gameState.deck = [...gameState.pile].sort(() => Math.random() - 0.5);
            gameState.pile = [top];
        }
        if (gameState.deck.length > 0) {
            gameState.hands[playerIndex].push(gameState.deck.pop());
        }
    }

    function nextTurn() {
        gameState.currentTurn = (gameState.currentTurn + 1) % gameState.numPlayers;
        updateUI();
    }

    function runCpuTurn() {
        if (gameState.currentTurn === 0) return;
        let cpuIdx = gameState.currentTurn;
        let hand = gameState.hands[cpuIdx];

        // Find valid card
        let validIdx = hand.findIndex(card => isValidMove(card));

        if (validIdx !== -1) {
            let card = hand.splice(validIdx, 1)[0];
            gameState.pile.push(card);

            if (hand.length === 0) {
                alert(`CPU ${cpuIdx} won the game! Better luck next time.`);
                location.reload();
                return;
            }

            if (card.shape === 'Whot') {
                // CPU picks its most frequent shape
                let counts = {};
                hand.forEach(c => counts[c.shape] = (counts[c.shape] || 0) + 1);
                let bestShape = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, 'Circle');
                gameState.activeShape = bestShape;
                gameState.activeVal = 20;
            } else {
                gameState.activeShape = card.shape;
                gameState.activeVal = card.val;
            }
        } else {
            // Draw card if no valid move
            drawCardForPlayer(cpuIdx);
        }

        nextTurn();
    }
</script>
</body>
</html>
