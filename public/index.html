<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot.40 Whot Game - Hadriel & Ajayi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .header-bar {
      text-align: center;
      margin-bottom: 12px;
    }

    .header-bar h1 {
      color: #00e676;
      font-size: 26px;
      margin-bottom: 2px;
    }

    .header-bar p {
      font-size: 12px;
      color: #b0bec5;
    }

    .mode-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-btn {
      background: #263238;
      color: #fff;
      border: 1px solid #455a64;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .mode-btn.active {
      background: #00e676;
      color: #000;
      border-color: #00e676;
    }

    .game-board {
      width: 100%;
      max-width: 500px;
      background: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .hand-label {
      font-size: 12px;
      color: #00e676;
      font-weight: bold;
    }

    .card-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 5px;
      min-height: 90px;
      align-items: center;
    }

    .center-table {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #2a2a2a;
      padding: 12px;
      border-radius: 8px;
    }

    .card {
      width: 55px;
      height: 80px;
      background: #ffffff;
      color: #000000;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
      cursor: pointer;
      flex-shrink: 0;
    }

    .card.back {
      background: #00e676;
      color: #000000;
      justify-content: center;
      align-items: center;
      font-size: 10px;
      font-weight: bold;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
      max-width: 500px;
    }

    .action-btn {
      flex: 1;
      padding: 10px;
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .cheat-trigger {
      background: #ff1744;
      color: white;
    }

    .log-area {
      width: 100%;
      max-width: 500px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      height: 70px;
      margin-top: 10px;
      padding: 8px;
      font-size: 11px;
      color: #00e676;
      overflow-y: auto;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background: #1e1e1e;
      border: 2px solid #ff1744;
      padding: 15px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cheat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .cheat-btn {
      background: #ff1744;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>Dot.40 WHOT</h1>
    <p>By Hadriel & Ajayi</p>
  </div>

  <div class="mode-bar">
    <button class="mode-btn active" id="btn-single" onclick="switchMode('single')">Single Player</button>
    <button class="mode-btn" id="btn-practice" onclick="switchMode('practice')">Practice Mode</button>
  </div>

  <div class="game-board">
    <div class="hand-label">CPU HAND (<span id="cpu-count">5</span>)</div>
    <div class="card-row" id="cpu-row"></div>

    <div class="center-table">
      <div>
        <div style="font-size:10px; color:#aaa; text-align:center; margin-bottom:2px;">MARKET</div>
        <div class="card back" onclick="playerDraw()">
          <div>DOT.40</div>
          <div id="deck-size" style="font-size:9px;">30</div>
        </div>
      </div>

      <div>
        <div style="font-size:10px; color:#aaa; text-align:center; margin-bottom:2px;">PLAY PILE</div>
        <div id="played-card"></div>
      </div>
    </div>

    <div class="hand-label">YOUR HAND</div>
    <div class="card-row" id="player-row"></div>
  </div>

  <div class="controls-row">
    <button class="action-btn" onclick="playerDraw()">Draw Card</button>
    <button class="action-btn cheat-trigger" onclick="toggleCheatMenu(true)">10 Cheats Menu</button>
  </div>

  <div class="log-area" id="log-box">Welcome to Dot.40 Whot!</div>

  <!-- CHEATS MODAL -->
  <div class="modal-overlay" id="cheat-modal">
    <div class="modal-box">
      <h3 style="color:#ff1744; text-align:center; font-size:14px;">10 Effective Cheats</h3>
      <div class="cheat-grid">
        <button class="cheat-btn" onclick="cPeek()">1. Peek CPU Hand</button>
        <button class="cheat-btn" onclick="cAddWhot()">2. Give Whot (20)</button>
        <button class="cheat-btn" onclick="cCPUDraw5()">3. Force CPU Draw 5</button>
        <button class="cheat-btn" onclick="cInstantWin()">4. Instant Win</button>
        <button class="cheat-btn" onclick="cSwap()">5. Swap Hands</button>
        <button class="cheat-btn" onclick="cSkipCPU()">6. Skip CPU Turn</button>
        <button class="cheat-btn" onclick="cHoldOnSpam()">7. Add Hold-On Cards</button>
        <button class="cheat-btn" onclick="cPeekDeck()">8. Peek Market Top</button>
        <button class="cheat-btn" onclick="cClearCPU()">9. Wipe CPU Market</button>
        <button class="cheat-btn" onclick="cInfiniteTurns()">10. Infinite Turns</button>
      </div>
      <button class="action-btn" style="margin-top:5px; padding:6px;" onclick="toggleCheatMenu(false)">Close</button>
    </div>
  </div>

  <script>
    const shapes = ["Circle", "Triangle", "Cross", "Square", "Star"];
    const symbols = { "Circle": "●", "Triangle": "▲", "Cross": "✖", "Square": "■", "Star": "★", "Whot": "W" };

    let deck = [];
    let pHand = [];
    let cpuHand = [];
    let topCard = null;
    let mode = "single"; 
    let pTurn = true;
    let cpuVisible = false;

    function createDeck() {
      deck = [];
      shapes.forEach(s => {
        [1, 2, 3, 4, 5, 7, 8, 10, 11, 12, 13, 14].forEach(n => deck.push({ shape: s, num: n }));
      });
      for (let i = 0; i < 4; i++) deck.push({ shape: "Whot", num: 20 });
      deck.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      createDeck();
      pHand = deck.splice(0, 5);
      cpuHand = deck.splice(0, 5);
      topCard = deck.pop();
      pTurn = true;
      writeLog("New game started!");
      updateUI();
    }

    function switchMode(newMode) {
      mode = newMode;
      document.getElementById('btn-single').classList.toggle('active', mode === 'single');
      document.getElementById('btn-practice').classList.toggle('active', mode === 'practice');
      writeLog(mode === 'practice' ? "Practice Mode ON: Watch logs for helpful tips." : "Single Player Mode active.");
      initGame();
    }

    function updateUI() {
      document.getElementById('deck-size').innerText = deck.length;
      document.getElementById('played-card').innerHTML = cardHTML(topCard);

      // Render Player
      const pRow = document.getElementById('player-row');
      pRow.innerHTML = '';
      pHand.forEach((c, idx) => {
        const div = document.createElement('div');
        div.innerHTML = cardHTML(c);
        div.onclick = () => playCard(idx);
        pRow.appendChild(div);
      });

      // Render CPU
      const cpuRow = document.getElementById('cpu-row');
      cpuRow.innerHTML = '';
      document.getElementById('cpu-count').innerText = cpuHand.length;
      cpuHand.forEach(c => {
        const div = document.createElement('div');
        div.innerHTML = cpuVisible ? cardHTML(c) : `<div class="card back"><div>DOT.40</div></div>`;
        cpuRow.appendChild(div);
      });

      if (mode === 'practice' && pTurn) giveHint();
    }

    function cardHTML(c) {
      return `
        <div class="card">
          <div>${c.num}</div>
          <div style="text-align:center; font-size:16px;">${symbols[c.shape]}</div>
          <div style="font-size:8px; text-align:right;">${c.shape}</div>
        </div>
      `;
    }

    function playCard(idx) {
      if (!pTurn) return;
      const c = pHand[idx];
      if (c.num === 20 || c.shape === topCard.shape || c.num === topCard.num) {
        pHand.splice(idx, 1);
        topCard = c;
        writeLog(`You played ${c.num} ${c.shape}`);
        
        if (checkWin()) return;

        if (c.num === 1) {
          writeLog("Hold On! Play again.");
        } else {
          pTurn = false;
          setTimeout(cpuAction, 1000);
        }
        updateUI();
      } else {
        writeLog("Can't play that card!");
      }
    }

    function playerDraw() {
      if (!pTurn || deck.length === 0) return;
      pHand.push(deck.pop());
      writeLog("You drew a card.");
      pTurn = false;
      updateUI();
      setTimeout(cpuAction, 1000);
    }

    function cpuAction() {
      if (cpuHand.length === 0) return;
      let validIdx = cpuHand.findIndex(c => c.num === 20 || c.shape === topCard.shape || c.num === topCard.num);

      if (validIdx !== -1) {
        let c = cpuHand.splice(validIdx, 1)[0];
        topCard = c;
        writeLog(`CPU played ${c.num} ${c.shape}`);
        if (checkWin()) return;
        if (c.num === 1) {
          writeLog("CPU played Hold On and goes again!");
          setTimeout(cpuAction, 1000);
          return;
        }
      } else if (deck.length > 0) {
        cpuHand.push(deck.pop());
        writeLog("CPU drew a card.");
      }

      pTurn = true;
      updateUI();
    }

    function giveHint() {
      let matches = pHand.filter(c => c.num === 20 || c.shape === topCard.shape || c.num === topCard.num);
      if (matches.length > 0) {
        writeLog(`[Practice Hint] You have ${matches.length} playable card(s).`);
      } else {
        writeLog(`[Practice Hint] No match available. Tap 'Draw Card'.`);
      }
    }

    function checkWin() {
      if (pHand.length === 0) {
        alert("You Won Dot.40 Whot!");
        initGame();
        return true;
      }
      if (cpuHand.length === 0) {
        alert("CPU Won!");
        initGame();
        return true;
      }
      return false;
    }

    function writeLog(txt) {
      const box = document.getElementById('log-box');
      box.innerText = txt + "\n" + box.innerText;
    }

    function toggleCheatMenu(show) {
      document.getElementById('cheat-modal').style.display = show ? 'flex' : 'none';
    }

    /* 10 CHEATS */
    function cPeek() { cpuVisible = !cpuVisible; updateUI(); toggleCheatMenu(false); }
    function cAddWhot() { pHand.push({ shape: "Whot", num: 20 }); updateUI(); toggleCheatMenu(false); }
    function cCPUDraw5() { if(deck.length>=5) cpuHand.push(...deck.splice(0,5)); updateUI(); toggleCheatMenu(false); }
    function cInstantWin() { pHand = []; checkWin(); toggleCheatMenu(false); }
    function cSwap() { let t = [...pHand]; pHand = [...cpuHand]; cpuHand = t; updateUI(); toggleCheatMenu(false); }
    function cSkipCPU() { pTurn = true; writeLog("Skipped CPU turn!"); updateUI(); toggleCheatMenu(false); }
    function cHoldOnSpam() { pHand.push({ shape: "Circle", num: 1 }); updateUI(); toggleCheatMenu(false); }
    function cPeekDeck() { if(deck.length>0) alert(`Next card is: ${deck[deck.length-1].num} ${deck[deck.length-1].shape}`); toggleCheatMenu(false); }
    function cClearCPU() { cpuHand = []; checkWin(); toggleCheatMenu(false); }
    function cInfiniteTurns() { pTurn = true; writeLog("Infinite turns mode enabled!"); toggleCheatMenu(false); }

    initGame();
  </script>
</body>
</html>
