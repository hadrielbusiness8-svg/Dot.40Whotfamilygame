<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot.40 Whot - Powered by Hadriel & Ajayi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      background: #1c2541;
      width: 100%;
      max-width: 800px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
      border: 2px solid #3a506b;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER & BRANDING */
    .header {
      text-align: center;
      border-bottom: 2px solid #3a506b;
      padding-bottom: 10px;
    }

    .header h1 {
      color: #6fffe9;
      font-size: 28px;
      letter-spacing: 1.5px;
    }

    .header .credits {
      font-size: 12px;
      color: #5bc0be;
      margin-top: 4px;
    }

    /* NAVIGATION / MODES */
    .nav-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .nav-btn {
      background: #3a506b;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .nav-btn.active, .nav-btn:hover {
      background: #5bc0be;
      color: #0b132b;
    }

    /* GAME BOARD LAYOUT */
    .game-area {
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: #0b132b;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #3a506b;
    }

    .opponent-hand, .player-hand {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 5px;
      min-height: 110px;
      align-items: center;
    }

    .play-center {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #1c2541;
      padding: 15px;
      border-radius: 12px;
    }

    .card {
      width: 65px;
      height: 95px;
      background: #ffffff;
      color: #0b132b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s;
      flex-shrink: 0;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card.back {
      background: linear-gradient(135deg, #3a506b, #0b132b);
      border: 2px solid #5bc0be;
      color: #5bc0be;
      justify-content: center;
      align-items: center;
      font-size: 12px;
    }

    .card-symbol {
      text-align: center;
      font-size: 22px;
    }

    /* ACTION CONTROLS */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 120px;
      background: #5bc0be;
      color: #0b132b;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .btn:hover {
      background: #6fffe9;
    }

    .btn-cheat {
      background: #ff0055;
      color: white;
    }

    .btn-cheat:hover {
      background: #ff3377;
    }

    .log-box {
      background: #0b132b;
      padding: 10px;
      border-radius: 10px;
      height: 90px;
      overflow-y: auto;
      font-size: 12px;
      border: 1px solid #3a506b;
      color: #6fffe9;
    }

    /* CHEAT MENU MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #1c2541;
      padding: 20px;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      border: 2px solid #ff0055;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .cheat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .cheat-btn {
      background: #ff0055;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>🎴 DOT.40 WHOT</h1>
      <div class="credits">Created & Designed by <b>Hadriel & Ajayi</b></div>
    </div>

    <!-- MODE SWITCHER -->
    <div class="nav-bar">
      <button class="nav-btn active" onclick="setMode('single')">🕹️ Single Player</button>
      <button class="nav-btn" onclick="setMode('practice')">📘 Practice Mode</button>
      <button class="nav-btn" onclick="openCheatModal()">⚡ 10 Cheats Menu</button>
    </div>

    <!-- GAME BOARD -->
    <div class="game-area">
      <div style="font-size: 12px; color: #5bc0be;">
        🤖 <b>CPU Hand:</b> <span id="cpu-card-count">5 cards</span>
      </div>
      <div class="opponent-hand" id="cpu-hand"></div>

      <div class="play-center">
        <div>
          <div style="font-size:11px; color:#94a3b8; text-align:center;">MARKET DECK</div>
          <div class="card back" onclick="drawMarket()">
            <div>DOT.40</div>
            <div style="font-size:10px;" id="deck-count">30</div>
          </div>
        </div>

        <div>
          <div style="font-size:11px; color:#94a3b8; text-align:center;">PLAY PILE</div>
          <div id="played-card"></div>
        </div>
      </div>

      <div style="font-size: 12px; color: #5bc0be;">
        🔴 <b>Your Hand:</b>
      </div>
      <div class="player-hand" id="player-hand"></div>
    </div>

    <!-- CONTROLS & LOGS -->
    <div class="controls">
      <button class="btn" onclick="drawMarket()">📥 Draw Card</button>
      <button class="btn btn-cheat" onclick="openCheatModal()">⚡ Cheats (10)</button>
    </div>

    <div class="log-box" id="logs">
      <div>Welcome to Dot.40 Whot! Choose cards matching shape or number to play.</div>
    </div>
  </div>

  <!-- 10 CHEATS MODAL -->
  <div class="modal" id="cheat-modal">
    <div class="modal-content">
      <h3 style="color:#ff0055; text-align:center;">⚡ Dot.40 Ultimate 10 Cheats Menu</h3>
      <div class="cheat-grid">
        <button class="cheat-btn" onclick="cheatPeekCPU()">1. 👁️ Peek CPU Hand</button>
        <button class="cheat-btn" onclick="cheatForceWhot()">2. 🃏 Force Whot 20 Card</button>
        <button class="cheat-btn" onclick="cheatDraw5CPU()">3. 🎁 Make CPU Draw 5</button>
        <button class="cheat-btn" onclick="cheatClearPlayerHand()">4. 🚀 Instant Win</button>
        <button class="cheat-btn" onclick="cheatSwapHands()">5. 🔄 Swap Hands with CPU</button>

        <button class="cheat-btn" onclick="cheatSkipCPUTurn()">6. 🚫 Skip CPU Turn</button>
        <button class="cheat-btn" onclick="cheatUnlimitedMarket()">7. 💰 Infinite Cash/Draw</button>
        <button class="cheat-btn" onclick="cheatSeeDeckTop()">8. 🔮 See Deck Top Card</button>
        <button class="cheat-btn" onclick="cheatLockCPUMarket()">9. 🔒 Lock CPU Market</button>
        <button class="cheat-btn" onclick="cheatSuperHoldOn()">10. 👑 Super Hold On (Keep Turn)</button>
      </div>
      <button class="btn" style="margin-top:10px;" onclick="closeCheatModal()">Close Menu</button>
    </div>
  </div>

  <script>
    const shapes = ["Circle", "Triangle", "Cross", "Square", "Star"];
    const symbolMap = { "Circle": "🔴", "Triangle": "🔺", "Cross": "✖️", "Square": "⬛", "Star": "⭐", "Whot": "🃏" };

    let deck = [];
    let playerHand = [];
    let cpuHand = [];
    let topCard = null;
    let gameMode = 'single'; // 'single' or 'practice'
    let isPlayerTurn = true;
    let cpuPeekActive = false;

    function buildDeck() {
      deck = [];
      // standard Whot distribution
      shapes.forEach(shape => {
        [1, 2, 3, 4, 5, 7, 8, 10, 11, 12, 13, 14].forEach(num => {
          deck.push({ shape, num });
        });
      });
      // Add 4 Whot (20) cards
      for(let i=0; i<4; i++) deck.push({ shape: "Whot", num: 20 });
      deck.sort(() => Math.random() - 0.5);
    }

    function initGame() {
      buildDeck();
      playerHand = deck.splice(0, 5);
      cpuHand = deck.splice(0, 5);
      topCard = deck.pop();
      isPlayerTurn = true;
      log(`🎮 Dot.40 Whot started! Initial card: ${topCard.num} ${symbolMap[topCard.shape]}`);
      render();
    }

    function setMode(mode) {
      gameMode = mode;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (mode === 'practice') {
        log("📘 Practice Mode active! Look out for interactive move advice in logs.");
      } else {
        log("🕹️ Single Player Mode active against CPU.");
      }
      initGame();
    }

    function render() {
      // Render Deck count
      document.getElementById('deck-count').innerText = `${deck.length} Left`;

      // Render Played Card
      document.getElementById('played-card').innerHTML = renderCardHTML(topCard);

      // Render Player Hand
      const pContainer = document.getElementById('player-hand');
      pContainer.innerHTML = '';
      playerHand.forEach((card, index) => {
        const cardDiv = document.createElement('div');
        cardDiv.innerHTML = renderCardHTML(card);
        cardDiv.onclick = () => playCard(index);
        pContainer.appendChild(cardDiv);
      });

      // Render CPU Hand
      const cpuContainer = document.getElementById('cpu-hand');
      cpuContainer.innerHTML = '';
      document.getElementById('cpu-card-count').innerText = `${cpuHand.length} cards`;

      cpuHand.forEach((card) => {
        const cardDiv = document.createElement('div');
        if (cpuPeekActive) {
          cardDiv.innerHTML = renderCardHTML(card);
        } else {
          cardDiv.className = 'card back';
          cardDiv.innerHTML = '<div>DOT.40</div>';
        }
        cpuContainer.appendChild(cardDiv);
      });

      // Practice Hints
      if (gameMode === 'practice' && isPlayerTurn) {
        givePracticeHint();
      }
    }

    function renderCardHTML(card) {
      return `
        <div class="card">
          <div>${card.num}</div>
          <div class="card-symbol">${symbolMap[card.shape] || '🃏'}</div>
          <div style="text-align:right; font-size:10px;">${card.shape}</div>
        </div>
      `;
    }

    function playCard(index) {
      if (!isPlayerTurn) return;

      const card = playerHand[index];
      if (card.num === 20 || card.shape === topCard.shape || card.num === topCard.num) {
        playerHand.splice(index, 1);
        topCard = card;
        log(`🔴 You played ${card.num} ${symbolMap[card.shape]}`);

        if (checkWin()) return;

        // Special card logic
        if (card.num === 1) {
          log("⚡ Hold On! Play again.");
        } else if (card.num === 2) {
          log("⚡ Pick Two! CPU gets 2 cards.");
          cpuHand.push(...deck.splice(0, 2));
        } else if (card.num === 5) {
          log("⚡ Pick Three! CPU gets 3 cards.");
          cpuHand.push(...deck.splice(0, 3));
        } else {
          isPlayerTurn = false;
          setTimeout(cpuPlay, 1200);
        }
        render();
      } else {
        log("❌ Invalid card! Must match number or shape.");
      }
    }

    function drawMarket() {
      if (!isPlayerTurn) return;
      if (deck.length > 0) {
        let drawn = deck.pop();
        playerHand.push(drawn);
        log(`📥 You drew a card: ${drawn.num} ${symbolMap[drawn.shape]}`);
        isPlayerTurn = false;
        render();
        setTimeout(cpuPlay, 1200);
      }
    }

    function cpuPlay() {
      if (cpuHand.length === 0) return;

      // Find valid card
      let playableIdx = cpuHand.findIndex(c => c.num === 20 || c.shape === topCard.shape || c.num === topCard.num);

      if (playableIdx !== -1) {
        let card = cpuHand.splice(playableIdx, 1)[0];
        topCard = card;
        log(`🤖 CPU played ${card.num} ${symbolMap[card.shape]}`);

        if (checkWin()) return;

        if (card.num === 1) {
          log("⚡ CPU played Hold On and goes again!");
          setTimeout(cpuPlay, 1000);
          return;
        } else if (card.num === 2) {
          log("⚡ CPU played Pick Two! You draw 2 cards.");
          playerHand.push(...deck.splice(0, 2));
        } else if (card.num === 5) {
          log("⚡ CPU played Pick Three! You draw 3 cards.");
          playerHand.push(...deck.splice(0, 3));
        }
      } else {
        if (deck.length > 0) {
          cpuHand.push(deck.pop());
          log("📥 CPU went to market and drew a card.");
        }
      }

      isPlayerTurn = true;
      render();
    }

    function givePracticeHint() {
      let playable = playerHand.filter(c => c.num === 20 || c.shape === topCard.shape || c.num === topCard.num);
      if (playable.length > 0) {
        log(`💡 [Practice Hint]: You have ${playable.length} valid card(s) to play!`);
      } else {
        log(`💡 [Practice Hint]: No playable cards. Tap 'Draw Card' to take from Market.`);
      }
    }

    function checkWin() {
      if (playerHand.length === 0) {
        alert("🎉 CONGRATULATIONS! You won the Dot.40 Whot game!");
        initGame();
        return true;
      } else if (cpuHand.length === 0) {
        alert("💥 CPU Won! Better luck next time.");
        initGame();
        return true;
      }
      return false;
    }

    function log(msg) {
      const logBox = document.getElementById('logs');
      const entry = document.createElement('div');
      entry.innerText = msg;
      logBox.prepend(entry);
    }

    /* 10 CHEAT FUNCTIONS */
    function openCheatModal() { document.getElementById('cheat-modal').style.display = 'flex'; }
    function closeCheatModal() { document.getElementById('cheat-modal').style.display = 'none'; }

    function cheatPeekCPU() {
      cpuPeekActive = !cpuPeekActive;
      log(`⚡ Cheat 1: CPU Hand Peek ${cpuPeekActive ? 'Enabled' : 'Disabled'}`);
      render(); closeCheatModal();
    }

    function cheatForceWhot() {
      playerHand.unshift({ shape: "Whot", num: 20 });
      log("⚡ Cheat 2: Added Whot 20 Card to your hand!");
      render(); closeCheatModal();
    }

    function cheatDraw5CPU() {
      if (deck.length >= 5) {
        cpuHand.push(...deck.splice(0, 5));
        log("⚡ Cheat 3: Forced CPU to draw 5 cards!");
        render(); closeCheatModal();
      }
    }

    function cheatClearPlayerHand() {
      playerHand = [];
      checkWin();
      closeCheatModal();
    }

    function cheatSwapHands() {
      let temp = [...playerHand];
      playerHand = [...cpuHand];
      cpuHand = temp;
      log("⚡ Cheat 5: Swapped hands with CPU!");
      render(); closeCheatModal();
    }

    function cheatSkipCPUTurn() {
      isPlayerTurn = true;
      log("⚡ Cheat 6: Skipped CPU Turn! Your turn again.");
      render(); closeCheatModal();
    }

    function cheatUnlimitedMarket() {
      for(let i=0; i<3; i++) playerHand.push({ shape: shapes[Math.floor(Math.random()*shapes.length)], num: 1 });
      log("⚡ Cheat 7: Spawned 3 powerful Hold-On cards!");
      render(); closeCheatModal();
    }

    function cheatSeeDeckTop() {
      if (deck.length > 0) {
        let top = deck[deck.length - 1];
        alert(`🔮 Top card in market is: ${top.num} ${top.shape}`);
      }
      closeCheatModal();
    }

    function cheatLockCPUMarket() {
      log("⚡ Cheat 9: CPU Market access temporarily locked!");
      closeCheatModal();
    }

    function cheatSuperHoldOn() {
      isPlayerTurn = true;
      log("⚡ Cheat 10: Super Hold On active! You hold infinite turns.");
      render(); closeCheatModal();
    }

    // Initialize Game
    initGame();
  </script>
</body>
</html>
